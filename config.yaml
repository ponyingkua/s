exchange:
  name: binance_futures
  quote_asset: USDT
  min_volume_usdt_24h: 5000000

timeframes:
  - "15m"
  - "1h"
  - "4h"

scanning:
  cooldown_hours: 4
  state_path: "signal_state.json"
  klines_limit: 300
  min_history_bars: 260

indicators:
  ema:
    period: 200
  macd:
    fast: 12
    slow: 26
    signal: 9
  supertrend:
    period: 10
    multiplier: 2.5
  rsi:
    period: 14
  atr:
    period: 14
  adx:
    period: 14
  volume_spike:
    lookback: 20
    factor: 1.6

scoring:
  weights:
    ema_trend: 20
    macd_cross: 18
    supertrend: 25
    volume_spike: 12
    rsi_confluence: 18
    mtf_agreement: 15
    adx_strength: 15
  setup_bonus:
    breakout: 5
    pullback: 0
    continuation: -8
    extended: 0
  min_score_to_trigger: 63
  min_trend_alignment: 2
  min_direction_margin: 8

risk:
  atr_multiplier_sl: 1.8
  risk_reward_min: 1.8
  max_signals_per_run: 4
  adx_min: 21
  adx_strong: 35
  structure_sl_max_atr_mult: 2.5
  structure_sl_max_atr_mult_breakout: 3.5
  reject_structural_stop_too_wide: true
  max_signals_per_regime_episode: 2

setup_engine:
  structure_lookback: 20
  stop_lookback: 10
  pullback_atr_mult: 1.0
  breakout_buffer_atr_mult: 0.10
  extended_atr_mult: 3.2
  structure_sl_buffer_atr_mult: 0.25
  target_lookback: 40
  "15m":
    structure_lookback: 40
    stop_lookback: 10
    breakout_buffer_atr_mult: 0.12
    extended_atr_mult: 2.5
    target_lookback: 80
  "1h":
    structure_lookback: 25
    stop_lookback: 8
    breakout_buffer_atr_mult: 0.10
    extended_atr_mult: 3.0
    target_lookback: 50
  "4h":
    structure_lookback: 30
    stop_lookback: 6
    breakout_buffer_atr_mult: 0.08
    extended_atr_mult: 4.5
    target_lookback: 60
    pullback_atr_mult: 0.6

regime_filter:
  enabled: true
  symbol: "BTCUSDT"
  timeframe: "4h"
  adx_min: 27
  short_mode: "bear_only"
  long_mode: "bull_only"

symbol_filter:
  blacklist: []

notify:
  telegram:
    enabled: true
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"

backtest:
  fee_round_trip_pct: 0.001
  intrabar_tie_break: "conservative"
  max_holding_bars: 64

chart:
  auto_generate: true
  width_px: 2000
  height_ratio: 0.45
  candles_shown: 120
  theme:
    background: "#0d0d0f"
    grid: "#1c1c22"
    text: "#d8d8e0"
    bull: "#2ecc71"
    bear: "#e74c3c"
    ema: "#f5c542"
    supertrend_up: "#2ecc71"
    supertrend_down: "#e74c3c"
    entry: "#3498db"
    sl: "#e74c3c"
    tp: "#2ecc71"
    zone_fill: "#3498db"
    zone_alpha: 0.12