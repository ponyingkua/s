exchange:
  name: binance_futures
  quote_asset: USDT
  min_volume_usdt_24h: 5000000

timeframes:
  - "15m"
  - "1h"
  - "4h"

scanning:
  cooldown_hours: 4
  state_path: "signal_state.json"
  klines_limit: 300
  min_history_bars: 260

indicators:
  ema:
    period: 200
  macd:
    fast: 12
    slow: 26
    signal: 9
  supertrend:
    period: 10
    multiplier: 2.5
  rsi:
    period: 14
  atr:
    period: 14
  adx:
    period: 14
  volume_spike:
    lookback: 20
    factor: 1.6

scoring:
  weights:
    ema_trend: 20
    macd_cross: 18
    supertrend: 25
    volume_spike: 12
    rsi_confluence: 18
    mtf_agreement: 20
    adx_strength: 15
  # setup_bonus di-lookup lewat get_setup_bonus() di scanner.py, precedence:
  # [timeframe][direction][setup] > [timeframe][setup] > [direction][setup] > [setup].
  # Nilai hasil tuning dari backtest gabungan trades-raw-batch-{15m,1h,4h}.json
  # (8 simbol aktif, 19 Feb-6 Sep 2026) — in-sample satu window, cek ulang tiap ada data baru.
  setup_bonus:
    breakout: 8
    pullback: 0
    continuation: -18
    extended: -8
    long:
      extended: -22
    short:
      extended: 3
    "15m":
      pullback: -9   # tetap berlaku untuk SHORT (n=10, avg R -0.03 — masih tipis, belum diubah)
      long:
        extended: -40
        breakout: -8
        # LONG pullback 15m dua-puncak seperti 1h short-extended: skor 65-75
        # avg R -0.22 (n=23) vs skor 75-85 avg R +0.75 (n=9). Flat -9 (baris di
        # atas) kurang tajam untuk LONG -> override lebih dalam supaya klaster
        # lemah tersaring. Simulasi: n=18, avg R +0.44, win 44.4% (dari n=36,
        # avg R +0.04, win 33.3%). n makin turun jadi terlalu tipis untuk
        # penalti lebih dalam lagi (di -20 avg R malah balik negatif, n=4).
        pullback: -17
      short:
        extended: -8
      continuation: -24
    "1h":
      breakout: 16
      short:
        breakout: -20   # -10 sebelumnya TIDAK CUKUP: validasi 694 trade (21 Feb-8
        # Sep 2026, trades_raw_batch.json) tunjukkan BREAKOUT SHORT masih avg R
        # -0.743, win 0% (n=10 -- SELURUH populasi yang lolos threshold 65 lama,
        # bukan sampel sebagian; base_score-nya 75.4-83.0, semua turun di bawah
        # 65 dgn bonus -20 sehingga tersaring threshold flat). n kecil (10),
        # tapi win rate 0% di seluruh populasi cukup mencolok utk didalami --
        # cek ulang kalau n bertambah, terutama kalau muncul win pertama.
        # 6 sebelumnya (avg R +0.21, n=70) tidak lagi konsisten di data terbaru:
        # keseluruhan turun ke avg R +0.02 (n=127), 58% dari semua sinyal 1h.
        # Breakdown skor jelas dua-puncak (65-70: R -0.40 n=31; 70-75: R -0.04 n=36;
        # 75-80: R +0.33 n=56) -> bonus diturunkan ke -2 supaya klaster lemah di
        # bawah ambang tersaring, klaster 75-80 yang bagus tetap lolos.
        # Hasil simulasi n=74, avg R +0.31, win 47.3% (dari n=127, avg R +0.02, win 35.4%).
        extended: -2
        pullback: -22    # -6 sebelumnya belum cukup: masih avg R -0.27 (n=16), makin buruk di skor tinggi
    "4h":
      continuation: -35
      breakout: 0
      long:
        breakout: -22
        # -22 (top-level long.extended) masih net negatif: avg R -0.11 (n=12),
        # dan TIDAK ada zona skor yang membaik (flat ~-0.10 di skor rendah maupun
        # tinggi) -> beda pola dari 1h short-extended, jadi bukan soal ambang,
        # setup ini memang lemah di 4h. Didekatkan ke perlakuan 4h continuation
        # (-35) / 15m long-extended (-40): efektif nyaris exclude, bukan filter halus.
        extended: -38
      short:
        # -14 sebelumnya: n=3 saja, avg R -1.04, win 0% — sample sangat tipis,
        # diperdalam sebagai langkah konservatif, BUKAN hasil pencarian ambang
        # optimal (datanya tidak cukup untuk itu). Cek ulang begitu n bertambah.
        extended: -24
  # BREAKOUT & EXTENDED: sinyal yang "disetujui" TF lain justru avg R lebih buruk
  # (telat masuk rame-rame, bukan konfirmasi kualitas) -> dikecualikan dari bonus MTF.
  mtf_agreement_excluded_setups:
    - extended
    - breakout
  min_score_to_trigger: 65   # naik dari 63 — sumR gabungan (8 simbol) memuncak di sekitar skor 65
  # Opsional: override ambang per timeframe (get_min_score_to_trigger() di
  # scanner.py). Kosong/tidak diisi = semua TF pakai min_score_to_trigger di
  # atas (perilaku lama, tidak berubah).
  #
  # VALIDASI (825 trade 15m, 8 simbol, 21 Feb-8 Sep 2026, dari
  # trades_raw_batch.json hasil config saat ini -- konfirmasi non-monotonik
  # yang dicatat sebelumnya, sekaligus temukan titik infleksi):
  #   score bucket   n    avg_R    win%
  #   65-70         299  -0.117   24.7
  #   70-75         265  -0.044   25.7
  #   75-80          92  -0.227   17.4
  #   80-85          55  -0.141   21.8
  #   85-90          58  +0.246   41.4   <- infleksi mulai di sini
  #   90-95          42  -0.109   28.6   <- turun lagi, JANGAN naikkan ambang
  #                                          lebih tinggi dari 85 tanpa cek ulang
  #   95-100          8  +0.473   50.0   (n terlalu tipis utk threshold sendiri)
  #
  # Simulasi ambang kumulatif (>=X, re-filter trade existing, TIDAK
  # mensimulasikan ulang interaksi cooldown/max_signals_per_run/regime-episode
  # yang berubah kalau threshold naik -- treat sebagai indikasi arah):
  #   >=65: n=825 (100%)   avg_R=-0.077  sum_R=-63.4
  #   >=80: n=169 (20.5%)  avg_R=+0.025  sum_R=+4.2
  #   >=85: n=114 (13.8%)  avg_R=+0.104  sum_R=+11.9  win=36.0%  <- dipilih
  #   >=90: n=56  (6.8%)   avg_R=-0.042  sum_R=-2.3   (turun lagi)
  #
  # 85 dipilih: titik terbaik dengan n masih 2 digit tebal (114), bukan cuma
  # tepi sampel tipis. BELUM dites lewat backtest.py --batch --timeframe 15m
  # sungguhan dengan config ini (angka di atas dari re-filter trade existing,
  # bukan re-run penuh) -- jalankan itu dulu sebelum live, dan cek lagi kalau
  # ada data baru karena titik infleksi bisa bergeser.
  min_score_to_trigger_by_tf:
    "15m": 85
  # Rentang skor yang dikecualikan meski sudah lolos min_score_to_trigger --
  # lubang di tengah, bukan sekadar ambang bawah. Dicek lewat
  # is_score_excluded() di scanner.py, di DUA titik: score_at() (pra-MTF) dan
  # sekali lagi setelah MTF agreement bonus diterapkan di run_scan()/
  # backtest_symbol() -- lihat komentar is_score_excluded() untuk kenapa
  # re-check kedua itu wajib.
  #
  # VALIDASI (120 trade 15m, 8 simbol, 26 Feb-4 Sep 2026, dari
  # trades_raw_batch.json hasil RE-RUN backtest.py --batch sungguhan dengan
  # min_score_to_trigger_by_tf 15m:85 + pullback_confirmation.enabled:false
  # di atas -- BUKAN cuma re-filter approximate seperti validasi
  # min_score_to_trigger_by_tf):
  #   Setelah threshold 85 diterapkan: overall avg_R masih -0.066 (belum
  #   positif, meleset dari estimasi approximate +0.104 sebelumnya -- populasi
  #   trade berubah signifikan krn gate pullback mati mengubah klasifikasi
  #   setup_type/skor banyak trade, CONTINUATION+EXTENDED nyaris hilang total
  #   krn kombinasi penalti besar + threshold 85 saling memperkuat).
  #   BREAKOUT (n=113, 94% dari total) breakdown by score, LONG & SHORT
  #   konsisten sama-sama anjlok di satu rentang spesifik:
  #     85-90: n=50  avg_R=+0.191  win=38.0%
  #     90-95: n=42  avg_R=-0.282  win=23.8%   <- lubang, LONG & SHORT sama
  #     95-100: n=10 avg_R=+0.132  win=40.0%
  #     100-105: n=11 avg_R=-0.287 win=9.1%    (n tipis, belum dikecualikan)
  #
  # is_score_excluded() TIDAK menjelaskan MEKANISME kenapa 90-95 buruk --
  # trade JSON cuma simpan skor final, bukan breakdown komponen (trend/rsi/
  # adx/setup_bonus terpisah), jadi tidak bisa ditelusuri dari data yang ada
  # tanpa instrumentasi tambahan di Trade dataclass (backtest.py). ANGKA DI
  # BAWAH INI ADALAH BAND-AID YANG DISENGAJA: exclude langsung berdasarkan
  # pola deskriptif (konsisten LONG+SHORT, n=42 bukan super tipis), tanpa
  # menunggu tahu penyebabnya. Cek ulang begitu ada data baru -- band ini
  # bisa jadi cuma menutupi gejala dari sumber lain yang belum ketemu.
  excluded_score_bands:
    "15m":
      - [90, 95]
    # 1h: dict bersarang (bukan list langsung) krn butuh presisi per
    # setup_type+direction -- lihat is_score_excluded() utk format & precedence
    # (ADITIF: "all" + override spesifik digabung, bukan saling menimpa).
    #
    # "all": [90,100] pada SKOR FINAL -- divalidasi 662 trade 1h (22 Feb-9 Sep
    # 2026, trades_raw_batch.json, config short.breakout:-20 sudah aktif):
    # rentang ini sekarang KOSONG (n=0) krn BREAKOUT SHORT yang dulu ngisi
    # situ sudah tersaring duluan oleh short.breakout:-20. Dibiarkan aktif
    # sbg guard kalau pola serupa muncul lagi di data mendatang, tidak
    # mengubah apa pun saat ini.
    #
    # continuation.long: [72,82] pada SKOR FINAL -- KOREKSI dari revisi
    # sebelumnya yang salah: klaim lama bilang band "all" [90,100] sudah
    # menangani CONTINUATION LONG, itu SALAH -- band itu dicek di SKOR FINAL,
    # sedangkan analisis yang mendasarinya pakai BASE SCORE (final+18, krn
    # bonus lama continuation:-18 flat) tanpa dikonversi balik. base_score
    # 90-100 == final_score 72-82, BUKAN final_score 90-100. Validasi ulang
    # (data yang sama, 662 trade): CONTINUATION LONG di final_score 72-82
    # n=70, avg R -0.288, win 20.0% -- sementara BREAKOUT LONG di RENTANG
    # FINAL SCORE YANG SAMA n=21, avg R +0.461, win 47.6%. Kalau band ini
    # dibuat TF-wide (spt "all"), BREAKOUT LONG yang bagus itu ikut terbuang
    # -- makanya butuh override setup+direction spesifik, bukan flat.
    # Precedence "tinggi=jelek" ini juga TIDAK bisa diperbaiki lewat
    # setup_bonus/penalti flat (sudah dicoba, penalti makin dalam cuma
    # membuang base_score RENDAH yang justru bagus, arahnya salah) --
    # exclude band presisi adalah satu-satunya mekanisme yang cocok.
    # BELUM di-backtest ulang dgn override baru ini -- estimasi di atas dari
    # re-filter trade existing (n=70/n=21), bukan re-run backtest.py sungguhan.
    "1h":
      all:
        - [90, 100]
      continuation:
        long:
          - [72, 82]
  min_trend_alignment: 2
  min_direction_margin: 8

risk:
  atr_multiplier_sl: 1.8
  risk_reward_min: 1.8
  max_signals_per_run: 8
  adx_min: 21
  adx_strong: 35
  structure_sl_max_atr_mult: 2.5
  structure_sl_max_atr_mult_breakout: 3.5
  reject_structural_stop_too_wide: true
  max_signals_per_regime_episode: 4
  # TP final (di atas) tetap dihitung sama seperti sebelumnya (level struktur
  # atau RR minimum) -- partial_tp cuma menambah TP1 di depannya supaya
  # sebagian profit terkunci lebih awal, bukan mengganti logika TP final.
  # Belum divalidasi lewat backtest granular (tp1_rr/tp1_close_pct masih
  # nilai default akal-sehat) -- cek ulang avg R & win rate setelah beberapa
  # batch backtest baru sebelum tuning lebih lanjut.
  partial_tp:
    enabled: true
    tp1_rr: 1.0                 # TP1 di RR 1.0 (1x jarak SL), selalu < RR TP final
    tp1_close_pct: 0.5          # tutup 50% posisi di TP1
    move_sl_to_breakeven: true  # sisa 50% posisi: SL digeser ke entry setelah TP1 kena
    breakeven_buffer_r: -0.05   # geser breakeven +/- sekian R dari entry (0 = pas di entry).
    # -0.05: SL sisa posisi digeser sedikit di bawah entry (LONG) / atas entry
    # (SHORT) setelah TP1 kena -- lebih realistis vs slippage & fee round-trip
    # dibanding breakeven presisi di harga entry.

setup_engine:
  structure_lookback: 20
  stop_lookback: 10
  pullback_atr_mult: 1.0
  breakout_buffer_atr_mult: 0.10
  extended_atr_mult: 3.2
  # Di atas ambang ini setup diklasifikasikan OVEREXTENDED dan ditolak langsung
  # (bukan cuma dapat bonus 0 seperti EXTENDED biasa). Belum divalidasi granular
  # per-trade lewat backtest — default sengaja longgar, cek ulang kalau ternyata
  # kebanyakan menolak trade sehat.
  overextended_atr_mult: 5.5
  structure_sl_buffer_atr_mult: 0.25
  target_lookback: 40
  # Gate konfirmasi tambahan untuk PULLBACK (classify_setup -> _pullback_confirmed
  # di scanner.py). Kalau enabled, mensyaratkan candle pemicu bergerak searah
  # sinyal (bukan cuma "kebetulan dekat EMA") sebelum diklasifikasikan PULLBACK;
  # gagal -> jatuh ke CONTINUATION, bukan ditolak total.
  #
  # DIMATIKAN (enabled: false) setelah divalidasi terhadap 825 trade 15m
  # (21 Feb-8 Sep 2026, trades_raw_batch.json — gate ini AKTIF saat data
  # dikumpulkan): PULLBACK LONG yang LOLOS gate (n=159, avg R -0.132) justru
  # LEBIH BURUK dari CONTINUATION LONG (n=302, avg R -0.091) — tempat di mana
  # trade seharusnya jatuh kalau gate bekerja dan menyaring yang lemah. Kalau
  # gate efektif, populasi yang lolos harusnya lebih baik dari yang gagal,
  # bukan sebaliknya. Root cause: require_bullish_candle/require_bearish_candle
  # cuma mensyaratkan close != open (candle hijau/merah setipis apa pun lolos),
  # jadi hampir tidak membedakan apa-apa — gate memangkas 50% volume PULLBACK
  # LONG (320->159) tapi avg R nyaris tidak bergerak (-0.155 -> -0.132).
  #
  # Filter kualitas PULLBACK 15m sekarang diserahkan ke
  # scoring.min_score_to_trigger_by_tf (lihat komentar di sana) yang titik
  # infleksinya jauh lebih jelas dan konsisten di data yang sama.
  #
  # require_rsi_turn: true BELUM dicoba (syarat lebih ketat dari sekadar warna
  # candle) -- kalau mau eksperimen lagi nanti, nyalakan enabled:true +
  # require_rsi_turn:true dan bandingkan avg R PULLBACK LONG vs CONTINUATION
  # LONG dengan cara yang sama seperti di atas, jangan cuma lihat avg R
  # PULLBACK sendirian sebelum/sesudah.
  pullback_confirmation:
    enabled: false
    require_bullish_candle: true   # LONG: candle pemicu harus close > open
    require_bearish_candle: true   # SHORT: candle pemicu harus close < open
    require_rsi_turn: false        # opsional, lebih ketat: RSI harus naik (LONG)/turun (SHORT) vs candle sebelumnya
  "15m":
    structure_lookback: 40
    stop_lookback: 10
    breakout_buffer_atr_mult: 0.12
    extended_atr_mult: 2.5
    overextended_atr_mult: 4.5
    target_lookback: 80
  "1h":
    structure_lookback: 25
    stop_lookback: 8
    breakout_buffer_atr_mult: 0.10
    extended_atr_mult: 3.0
    overextended_atr_mult: 5.5
    target_lookback: 50
  "4h":
    structure_lookback: 30
    stop_lookback: 6
    breakout_buffer_atr_mult: 0.08
    extended_atr_mult: 4.5
    overextended_atr_mult: 8.0
    target_lookback: 60
    pullback_atr_mult: 0.6

regime_filter:
  enabled: true
  symbol: "BTCUSDT"
  timeframe: "4h"
  adx_min: 27
  # "not_bull" (bukan "bear_only") supaya SHORT tetap boleh di regime NEUTRAL,
  # bukan cuma BEAR murni yang nyaris tidak pernah terjadi.
  short_mode: "not_bull"
  long_mode: "not_bear"

notify:
  telegram:
    enabled: true
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"

backtest:
  fee_round_trip_pct: 0.001
  intrabar_tie_break: "conservative"
  max_holding_bars: 64

chart:
  auto_generate: true
  width_px: 2800
  height_ratio: 0.45
  # Fallback untuk timeframe di luar 15m/1h/4h; ketiga TF utama sudah override
  # lewat MAX_CANDLES_BY_TF di chart.py.
  candles_shown: 120
  # Palet warna chart (kandil, EMA, Supertrend, entry/SL/TP, zona demand/supply,
  # dst) di-hardcode di chart.py sendiri, bukan dibaca dari sini.