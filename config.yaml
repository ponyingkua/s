exchange:
  name: binance_futures
  quote_asset: USDT
  min_volume_usdt_24h: 5000000

timeframes:
  - "15m"
  - "1h"
  - "4h"

scanning:
  cooldown_hours: 4
  state_path: "signal_state.json"
  klines_limit: 300
  min_history_bars: 260

indicators:
  ema:
    period: 200
  macd:
    fast: 12
    slow: 26
    signal: 9
  supertrend:
    period: 10
    multiplier: 2.5
  rsi:
    period: 14
  atr:
    period: 14
  adx:
    period: 14
  volume_spike:
    lookback: 20
    factor: 1.6

scoring:
  weights:
    ema_trend: 20
    macd_cross: 18
    supertrend: 25
    volume_spike: 12
    rsi_confluence: 18
    mtf_agreement: 20
    adx_strength: 15
  # mtf_agreement TIDAK otomatis "selalu bagus" — lihat
  # mtf_agreement_excluded_setups di bawah.
  #
  # setup_bonus di-tuning dari backtest gabungan 1070 trade tertutup
  # (15m/1h/4h, 9 simbol aktif — DOGEUSDT sudah diblacklist sejak tuning
  # sebelumnya jadi tidak muncul lagi, 19 Feb-6 Sep 2026,
  # trades-raw-batch-{15m,1h,4h}.json). Precedence lookup (paling spesifik
  # menang): [timeframe][direction][setup] > [timeframe][setup] >
  # [direction][setup] > [setup] flat. Nilai dari tuning sebelumnya (extended,
  # continuation) tetap dipakai; ini lapisan tambahan di atasnya:
  #   - PULLBACK ternyata TIDAK netral seperti diasumsikan (bonus 0
  #     sebelumnya): 15m PULLBACK rugi di kedua arah (LONG n=97 avg R -0.057,
  #     SHORT n=161 avg R -0.029) dan 1h SHORT PULLBACK juga rugi (n=43 avg R
  #     -0.065). 1h LONG PULLBACK (n=35 avg R +0.087) dan 4h PULLBACK kedua
  #     arah (n=15/n=10, avg R +0.242/+0.114) tetap sehat — tidak disentuh.
  #   - BREAKOUT ternyata timpang per arah, bukan flat baik seperti
  #     diasumsikan: 15m LONG BREAKOUT rugi (n=49 avg R -0.039) sementara 15m
  #     SHORT BREAKOUT tetap salah satu setup terbaik (n=124 avg R +0.157).
  #     Pola sama di 4h: LONG rugi besar (n=17 avg R -0.282) sementara SHORT
  #     justru setup terbaik di 4h (n=10 avg R +0.467). Split per-arah
  #     ditambahkan; sisi yang sehat dibiarkan mewarisi bonus flat/TF yang
  #     sudah ada (15m/global breakout: 8, 4h breakout: 0).
  #   - 4h SHORT EXTENDED masih net rugi meski sudah dipenalti -6 dari tuning
  #     sebelumnya (n=17 avg R -0.204) — dinaikkan jadi -14.
  # CATATAN: tetap in-sample dari satu window backtest (bukan out-of-sample
  # tervalidasi) — cek ulang setelah ada data baru, terutama kombinasi 4h
  # (n paling tipis di seluruh dataset ini).
  setup_bonus:
    breakout: 8
    pullback: 0
    continuation: -18
    extended: -8
    long:
      extended: -22
    short:
      extended: 3
    "15m":
      pullback: -9      # baru — net rugi kedua arah, lihat catatan di atas
      long:
        extended: -40
        breakout: -8    # baru — n=49 avg R -0.039, SHORT 15m breakout tidak disentuh
      short:
        extended: -8
      continuation: -24
    "1h":
      breakout: 16
      short:
        extended: -4
        pullback: -6    # baru — n=43 avg R -0.065, LONG 1h pullback tidak disentuh
    "4h":
      continuation: -35
      breakout: 0        # tetap 0 — ini sekarang jadi fallback SHORT 4h breakout saja
      long:
        breakout: -22    # baru — n=17 avg R -0.282, jauh lebih buruk dari SHORT 4h breakout (+0.467)
      short:
        extended: -14    # dari -6 — masih avg R -0.204 (n=17) meski sudah dipenalti
  # BREAKOUT ditambahkan ke daftar ini: sinyal yang "disetujui" TF lain
  # avg R-nya jauh lebih buruk (avg R -0.201, n=22) dibanding yang tidak
  # (avg R +0.179, n=273) — pola sama seperti EXTENDED, MTF agreement di sini
  # menandakan telat masuk rame-rame, bukan konfirmasi kualitas.
  mtf_agreement_excluded_setups:
    - extended
    - breakout
  min_score_to_trigger: 63
  min_trend_alignment: 2
  min_direction_margin: 8

risk:
  atr_multiplier_sl: 1.8
  risk_reward_min: 1.8
  max_signals_per_run: 4
  adx_min: 21
  adx_strong: 35
  structure_sl_max_atr_mult: 2.5
  structure_sl_max_atr_mult_breakout: 3.5
  reject_structural_stop_too_wide: true
  max_signals_per_regime_episode: 2

setup_engine:
  structure_lookback: 20
  stop_lookback: 10
  pullback_atr_mult: 1.0
  breakout_buffer_atr_mult: 0.10
  extended_atr_mult: 3.2
  # Guardrail BARU: di atas ambang ini, setup diklasifikasikan OVEREXTENDED dan
  # sinyal DITOLAK langsung (bukan cuma dapat bonus 0 seperti EXTENDED biasa).
  # Backtest tidak mencatat jarak-ke-EMA per trade, jadi angka ini belum
  # divalidasi lewat re-run — defaultnya sengaja longgar (~1.8x extended_atr_mult)
  # supaya cuma menyaring kasus blow-off/capitulation paling ekstrem. Cek ulang
  # setelah backtest ulang; naikkan kalau ternyata kebanyakan menolak trade sehat.
  overextended_atr_mult: 5.5
  structure_sl_buffer_atr_mult: 0.25
  target_lookback: 40
  "15m":
    structure_lookback: 40
    stop_lookback: 10
    breakout_buffer_atr_mult: 0.12
    extended_atr_mult: 2.5
    overextended_atr_mult: 4.5
    target_lookback: 80
  "1h":
    structure_lookback: 25
    stop_lookback: 8
    breakout_buffer_atr_mult: 0.10
    extended_atr_mult: 3.0
    overextended_atr_mult: 5.5
    target_lookback: 50
  "4h":
    structure_lookback: 30
    stop_lookback: 6
    breakout_buffer_atr_mult: 0.08
    extended_atr_mult: 4.5
    overextended_atr_mult: 8.0
    target_lookback: 60
    pullback_atr_mult: 0.6

regime_filter:
  enabled: true
  symbol: "BTCUSDT"
  timeframe: "4h"
  adx_min: 27
  # "not_bull" (bukan "bear_only") supaya SHORT juga boleh di regime NEUTRAL,
  # tidak cuma BEAR murni — BEAR murni (ADX>=27, EMA & Supertrend BTC 4h
  # sama-sama turun) nyaris tidak pernah terjadi, jadi "bear_only" mematikan
  # sisi SHORT total. Sudah divalidasi lewat backtest gabungan 1496 trade
  # (Feb-Sep 2026): SHORT jadi mayoritas volume (1054/1496) dan net positif
  # (sum R +30.35) setelah tuning setup_bonus di atas.
  short_mode: "not_bull"
  long_mode: "bull_only"

symbol_filter:
  # DOGEUSDT: net rugi paling besar & paling konsisten pada window backtest
  # sebelumnya — sudah diblacklist sejak itu, karena itu tidak lagi muncul di
  # trades-raw-batch-*.json saat ini.
  # LTCUSDT: sekarang jadi simbol paling rugi dari 9 simbol aktif tersisa
  # (n=123, avg R -0.054, sum R -6.63 dari 1070 trade tertutup total, window
  # 19 Feb-6 Sep 2026) — rugi hampir konsisten di semua kombinasi arah/setup/
  # timeframe (bukan satu outlier), pola sama seperti DOGEUSDT dulu.
  blacklist:
    - DOGEUSDT
    - LTCUSDT

notify:
  telegram:
    enabled: true
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"

backtest:
  fee_round_trip_pct: 0.001
  intrabar_tie_break: "conservative"
  max_holding_bars: 64

chart:
  auto_generate: true
  width_px: 2000
  height_ratio: 0.45
  candles_shown: 120
  theme:
    background: "#0d0d0f"
    grid: "#1c1c22"
    text: "#d8d8e0"
    bull: "#2ecc71"
    bear: "#e74c3c"
    ema: "#f5c542"
    supertrend_up: "#2ecc71"
    supertrend_down: "#e74c3c"
    entry: "#3498db"
    sl: "#e74c3c"
    tp: "#2ecc71"
    zone_fill: "#3498db"
    zone_alpha: 0.12