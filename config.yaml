exchange:
  name: binance_futures
  quote_asset: USDT
  min_volume_usdt_24h: 5000000

timeframes:
  - "15m"
  - "1h"
  - "4h"

scanning:
  cooldown_hours: 4
  state_path: "signal_state.json"
  klines_limit: 300
  min_history_bars: 260

indicators:
  ema:
    period: 200
  macd:
    fast: 12
    slow: 26
    signal: 9
  supertrend:
    period: 10
    multiplier: 2.5
  rsi:
    period: 14
  atr:
    period: 14
  adx:
    period: 14
  volume_spike:
    lookback: 20
    factor: 1.6

scoring:
  weights:
    ema_trend: 20
    macd_cross: 18
    supertrend: 25
    volume_spike: 12
    rsi_confluence: 18
    mtf_agreement: 20
    adx_strength: 15
  # mtf_agreement TIDAK otomatis "selalu bagus" — lihat
  # mtf_agreement_excluded_setups di bawah.
  #
  # setup_bonus di-tuning dari backtest gabungan 1496 trade tertutup
  # (15m/1h/4h, 10 simbol, Feb-Sep 2026, trades-raw-batch-{15m,1h,4h}.json).
  # Precedence lookup (paling spesifik menang): [timeframe][direction][setup]
  # > [timeframe][setup] > [direction][setup] > [setup] flat.
  # Perubahan dari tuning sebelumnya (data lama sudah tidak representatif
  # setelah regime_filter.short_mode pindah ke "not_bull" — volume SHORT jauh
  # lebih besar sekarang):
  #   - SHORT EXTENDED di 15m & 1h dulu dikira netral/positif, di data baru ini
  #     malah net rugi (15m n=425 avg R -0.057, 1h n=169 avg R -0.086) — bonus
  #     dibalik dari fallback +3 jadi negatif per-TF di bawah.
  #   - CONTINUATION di 4h (hampir semua LONG, n=30 avg R -0.387) tetap
  #     terburuk meski sudah dipenalti -28; dinaikkan lagi sampai efektif
  #     menyaring hampir semua kandidatnya.
  #   - CONTINUATION di 15m (n=69 avg R -0.246) dapat override TF baru,
  #     dari fallback -18.
  #   - BREAKOUT di 4h (LONG n=14 avg R -0.122, SHORT n=22 avg R -0.082) tidak
  #     mewarisi keunggulan BREAKOUT 15m/1h — bonus TF ini dilepas ke 0.
  # CATATAN: ini hasil in-sample dari satu window backtest (bukan
  # out-of-sample tervalidasi) — cek ulang setelah ada data baru, terutama
  # kombinasi bersampel kecil (4h secara umum punya n paling tipis).
  setup_bonus:
    breakout: 8
    pullback: 0
    continuation: -18
    extended: -8
    long:
      extended: -22
    short:
      extended: 3
    "15m":
      long:
        extended: -40
      short:
        extended: -8    # dari fallback +3 — net rugi di data baru (n=425, avg R -0.057)
      continuation: -24  # dari fallback -18 — LONG-nya sendiri (n=69) avg R -0.246
    "1h":
      breakout: 16
      short:
        extended: -4    # dari fallback +3 — net rugi di data baru (n=169, avg R -0.086)
    "4h":
      continuation: -35  # dari -28 — tetap avg R -0.387 (n=30) meski sudah dipenalti
      breakout: 0        # dari fallback +8 — BREAKOUT 4h tidak profitable (LONG n=14 avg R -0.122, SHORT n=22 avg R -0.082)
      short:
        extended: -6
  # BREAKOUT ditambahkan ke daftar ini: sinyal yang "disetujui" TF lain
  # avg R-nya jauh lebih buruk (avg R -0.201, n=22) dibanding yang tidak
  # (avg R +0.179, n=273) — pola sama seperti EXTENDED, MTF agreement di sini
  # menandakan telat masuk rame-rame, bukan konfirmasi kualitas.
  mtf_agreement_excluded_setups:
    - extended
    - breakout
  min_score_to_trigger: 63
  min_trend_alignment: 2
  min_direction_margin: 8

risk:
  atr_multiplier_sl: 1.8
  risk_reward_min: 1.8
  max_signals_per_run: 4
  adx_min: 21
  adx_strong: 35
  structure_sl_max_atr_mult: 2.5
  structure_sl_max_atr_mult_breakout: 3.5
  reject_structural_stop_too_wide: true
  max_signals_per_regime_episode: 2

setup_engine:
  structure_lookback: 20
  stop_lookback: 10
  pullback_atr_mult: 1.0
  breakout_buffer_atr_mult: 0.10
  extended_atr_mult: 3.2
  # Guardrail BARU: di atas ambang ini, setup diklasifikasikan OVEREXTENDED dan
  # sinyal DITOLAK langsung (bukan cuma dapat bonus 0 seperti EXTENDED biasa).
  # Backtest tidak mencatat jarak-ke-EMA per trade, jadi angka ini belum
  # divalidasi lewat re-run — defaultnya sengaja longgar (~1.8x extended_atr_mult)
  # supaya cuma menyaring kasus blow-off/capitulation paling ekstrem. Cek ulang
  # setelah backtest ulang; naikkan kalau ternyata kebanyakan menolak trade sehat.
  overextended_atr_mult: 5.5
  structure_sl_buffer_atr_mult: 0.25
  target_lookback: 40
  "15m":
    structure_lookback: 40
    stop_lookback: 10
    breakout_buffer_atr_mult: 0.12
    extended_atr_mult: 2.5
    overextended_atr_mult: 4.5
    target_lookback: 80
  "1h":
    structure_lookback: 25
    stop_lookback: 8
    breakout_buffer_atr_mult: 0.10
    extended_atr_mult: 3.0
    overextended_atr_mult: 5.5
    target_lookback: 50
  "4h":
    structure_lookback: 30
    stop_lookback: 6
    breakout_buffer_atr_mult: 0.08
    extended_atr_mult: 4.5
    overextended_atr_mult: 8.0
    target_lookback: 60
    pullback_atr_mult: 0.6

regime_filter:
  enabled: true
  symbol: "BTCUSDT"
  timeframe: "4h"
  adx_min: 27
  # "not_bull" (bukan "bear_only") supaya SHORT juga boleh di regime NEUTRAL,
  # tidak cuma BEAR murni — BEAR murni (ADX>=27, EMA & Supertrend BTC 4h
  # sama-sama turun) nyaris tidak pernah terjadi, jadi "bear_only" mematikan
  # sisi SHORT total. Sudah divalidasi lewat backtest gabungan 1496 trade
  # (Feb-Sep 2026): SHORT jadi mayoritas volume (1054/1496) dan net positif
  # (sum R +30.35) setelah tuning setup_bonus di atas.
  short_mode: "not_bull"
  long_mode: "bull_only"

symbol_filter:
  # DOGEUSDT: net rugi paling besar & paling konsisten dari 10 simbol backtest
  # (n=149, avg R -0.141, sum R -21.03 dari total sum R -39.06 sebelum
  # perbaikan setup_bonus di atas — lebih dari separuh kerugian portofolio
  # berasal dari satu simbol ini).
  blacklist:
    - DOGEUSDT

notify:
  telegram:
    enabled: true
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"

backtest:
  fee_round_trip_pct: 0.001
  intrabar_tie_break: "conservative"
  max_holding_bars: 64

chart:
  auto_generate: true
  width_px: 2000
  height_ratio: 0.45
  candles_shown: 120
  theme:
    background: "#0d0d0f"
    grid: "#1c1c22"
    text: "#d8d8e0"
    bull: "#2ecc71"
    bear: "#e74c3c"
    ema: "#f5c542"
    supertrend_up: "#2ecc71"
    supertrend_down: "#e74c3c"
    entry: "#3498db"
    sl: "#e74c3c"
    tp: "#2ecc71"
    zone_fill: "#3498db"
    zone_alpha: 0.12