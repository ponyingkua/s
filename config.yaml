exchange:
  name: binance_futures
  quote_asset: USDT
  min_volume_usdt_24h: 5000000

timeframes:
  - "15m"
  - "1h"
  - "4h"

scanning:
  cooldown_hours: 6
  state_path: "signal_state.json"
  klines_limit: 300
  min_history_bars: 250

indicators:
  ema:
    period: 200
  macd:
    fast: 12
    slow: 26
    signal: 9
  supertrend:
    period: 10
    multiplier: 2.5
  rsi:
    period: 14
  atr:
    period: 14
  adx:
    period: 14
  volume_spike:
    lookback: 20
    factor: 1.6

scoring:
  weights:
    ema_trend: 20
    macd_cross: 20
    supertrend: 25
    volume_spike: 15
    rsi_confluence: 20
    mtf_agreement: 15
    adx_strength: 15
  setup_bonus:
    "15m":
      long:
        breakout: 15
        pullback: 20
        continuation: -25
        extended: -60
      short:
        breakout: 10
        pullback: -10
        continuation: -30
        extended: -50
    "1h":
      long:
        breakout: 25
        pullback: -5
        continuation: -20
        extended: -45
      short:
        breakout: 5
        pullback: -15
        continuation: -25
        extended: -40
    "4h":
      long:
        breakout: 15
        pullback: 10
        continuation: -15
        extended: -25
      short:
        breakout: 10
        pullback: -10
        continuation: -30
        extended: -20
    long:
      breakout: 12
      pullback: 8
      continuation: -15
      extended: -25
    short:
      breakout: 0
      pullback: -15
      continuation: -25
      extended: -35
  min_score_to_trigger: 95
  min_trend_alignment: 2

risk:
  atr_multiplier_sl: 1.6
  risk_reward_min: 1.6
  max_signals_per_run: 4
  adx_min: 22
  adx_strong: 35
  structure_sl_max_atr_mult: 2.3
  # Cap khusus setup BREAKOUT — dibuat lebih longgar dari cap generik di atas
  # (lihat komentar di scanner.py score_at()) karena stop breakout secara
  # alami lebih lebar tanpa berarti struktur salah baca.
  structure_sl_max_atr_mult_breakout: 4.0
  max_signals_per_regime_episode: 2

setup_engine:
  structure_lookback: 20
  pullback_atr_mult: 1.0
  extended_atr_mult: 3.2
  structure_sl_buffer_atr_mult: 0.25
  # Lookback buat cari level resistance/support riil sebagai kandidat TP.
  # Kalau tidak diisi per-TF, default-nya 2x structure_lookback TF tsb.
  target_lookback: 40
  "15m":
    structure_lookback: 40
    extended_atr_mult: 2.5
  "1h":
    structure_lookback: 25
    extended_atr_mult: 3.0
  "4h":
    structure_lookback: 30
    # EMA200 di 4h jauh lebih lambat mengikuti trend kuat, jadi butuh
    # ambang lebih longgar biar trend sehat tidak salah ke-tag EXTENDED
    extended_atr_mult: 4.5

regime_filter:
  enabled: true
  symbol: "BTCUSDT"
  timeframe: "4h"
  adx_min: 27
  short_mode: "bear_only"
  long_mode: "bull_or_neutral"

symbol_filter:
  blacklist: []

notify:
  telegram:
    enabled: true
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"

backtest:
  fee_round_trip_pct: 0.001
  intrabar_tie_break: "conservative"

chart:
  auto_generate: true
  width_px: 2000
  height_ratio: 0.45
  candles_shown: 120
  theme:
    background: "#0d0d0f"
    grid: "#1c1c22"
    text: "#d8d8e0"
    bull: "#2ecc71"
    bear: "#e74c3c"
    ema: "#f5c542"
    supertrend_up: "#2ecc71"
    supertrend_down: "#e74c3c"
    entry: "#3498db"
    sl: "#e74c3c"
    tp: "#2ecc71"
    zone_fill: "#3498db"
    zone_alpha: 0.12

storage:
  db_path: "data/vsynapse.db"