exchange:
  name: binance_futures
  quote_asset: USDT
  min_volume_usdt_24h: 5000000

timeframes:
  - "15m"
  - "1h"
  - "4h"

scanning:
  cooldown_hours: 3
  state_path: "signal_state.json"
  klines_limit: 300
  min_history_bars: 260

indicators:
  ema:
    period: 200
  macd:
    fast: 12
    slow: 26
    signal: 9
  supertrend:
    period: 10
    multiplier: 2.5
  rsi:
    period: 14
  atr:
    period: 14
  adx:
    period: 14
  volume_spike:
    lookback: 20
    factor: 1.6

scoring:
  weights:
    ema_trend: 20
    macd_cross: 18
    supertrend: 25
    volume_spike: 12
    rsi_confluence: 18
    mtf_agreement: 20
    adx_strength: 15
  setup_bonus:
    breakout: 8
    pullback: 0
    continuation: -18
    extended: -8
    long:
      extended: -22
    short:
      extended: 3
    "15m":
      pullback: -9
      long:
        extended: -40
        breakout: -8
        pullback: -17
      short:
        extended: -8
      continuation: -24
    "1h":
      breakout: 16
      short:
        breakout: -20
        extended: -2
        pullback: -22
      long:
        pullback: -45
    "4h":
      continuation: -35
      breakout: 0
      long:
        breakout: -20
        extended: -50
      short:
        extended: -24
  mtf_agreement_excluded_setups:
    - extended
    - breakout
  min_score_to_trigger: 65
  min_score_to_trigger_by_tf:
    "15m": 85
  excluded_score_bands:
    "15m":
      - [90, 95]
    "1h":
      all:
        - [90, 100]
      continuation:
        long:
          - [65, 82]
      extended:
        short:
          - [70, 100]
      breakout:
        long:
          - [85, 90]
          - [100, 110]
          - [110, 115]
    "4h":
      - [80, 90]
  min_trend_alignment: 2
  min_direction_margin: 8

risk:
  atr_multiplier_sl: 1.8
  risk_reward_min: 1.8
  max_signals_per_run: 5
  adx_min: 21
  adx_strong: 35
  structure_sl_max_atr_mult: 2.5
  structure_sl_max_atr_mult_breakout: 3.5
  reject_structural_stop_too_wide: true
  max_signals_per_regime_episode: 2
  partial_tp:
    enabled: true
    tp1_rr: 1.0
    tp1_close_pct: 0.5
    move_sl_to_breakeven: true
    breakeven_buffer_r: -0.05

setup_engine:
  structure_lookback: 20
  stop_lookback: 10
  pullback_atr_mult: 1.0
  breakout_buffer_atr_mult: 0.10
  extended_atr_mult: 3.2
  overextended_atr_mult: 5.5
  structure_sl_buffer_atr_mult: 0.25
  target_lookback: 40
  pullback_confirmation:
    enabled: false
    require_bullish_candle: true
    require_bearish_candle: true
    require_rsi_turn: false
  "15m":
    structure_lookback: 40
    stop_lookback: 10
    breakout_buffer_atr_mult: 0.12
    extended_atr_mult: 2.5
    overextended_atr_mult: 4.5
    target_lookback: 80
  "1h":
    structure_lookback: 25
    stop_lookback: 8
    breakout_buffer_atr_mult: 0.10
    extended_atr_mult: 3.0
    overextended_atr_mult: 5.5
    target_lookback: 50
  "4h":
    structure_lookback: 30
    stop_lookback: 6
    breakout_buffer_atr_mult: 0.08
    extended_atr_mult: 4.5
    overextended_atr_mult: 8.0
    target_lookback: 60
    pullback_atr_mult: 0.6

regime_filter:
  enabled: true
  symbol: "BTCUSDT"
  timeframe: "4h"
  adx_min: 27
  short_mode: "not_bull"
  long_mode: "not_bear"

notify:
  telegram:
    enabled: true
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"

backtest:
  fee_round_trip_pct: 0.001
  intrabar_tie_break: "conservative"
  max_holding_bars: 64

chart:
  auto_generate: true
  retention_hours: 6
  width_px: 2800
  height_ratio: 0.45
  candles_shown: 120
