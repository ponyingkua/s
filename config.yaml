exchange:
  name: binance_futures
  quote_asset: USDT
  min_volume_usdt_24h: 5000000

timeframes:
  - "15m"
  - "1h"
  - "4h"

scanning:
  cooldown_hours: 4
  state_path: "signal_state.json"
  klines_limit: 300
  min_history_bars: 260

indicators:
  ema:
    period: 200
  macd:
    fast: 12
    slow: 26
    signal: 9
  supertrend:
    period: 10
    multiplier: 2.5
  rsi:
    period: 14
  atr:
    period: 14
  adx:
    period: 14
  volume_spike:
    lookback: 20
    factor: 1.6

scoring:
  weights:
    ema_trend: 20
    macd_cross: 18
    supertrend: 25
    volume_spike: 12
    rsi_confluence: 18
    mtf_agreement: 20
    adx_strength: 15
  # mtf_agreement TIDAK lagi otomatis "selalu bagus" — lihat
  # mtf_agreement_excluded_setups di bawah untuk pengecualian EXTENDED.
  #
  # Setup_bonus di-tuning ulang berdasarkan backtest GABUNGAN 1564 trade
  # tertutup (15m/1h/4h, 10 simbol, trades-raw-batch-{15m,1h,4h}.json,
  # Feb-Sep 2026), dipecah per timeframe x direction x setup_type — bukan
  # cuma per setup_type flat seperti sebelumnya, karena datanya menunjukkan
  # flat itu menyembunyikan asimetri besar antar arah:
  #   EXTENDED  15m LONG : n=170 avg R -0.333 sum -56.56  -> chasing pump, TERBURUK
  #             1h  LONG : n=96  avg R -0.224 sum -21.51
  #             15m SHORT: n=191 avg R +0.010 sum +1.91   -> netral, momentum turun lanjut
  #             1h  SHORT: n=76  avg R +0.092 sum +6.96   -> positif
  #             4h  SHORT: n=16  avg R -0.329 sum -5.26   -> sampel kecil, tetap negatif
  #   CONTINUATION (semua arah digabung, sampel per-arah kecil): net rugi di
  #             semua TF, terburuk di 4h (n=53 avg R -0.207 sum -10.95)
  #   BREAKOUT  1h (LONG+SHORT): n=94 avg R +0.283 sum +26.60 -> jauh terbaik,
  #             LONG-nya sendiri n=27 avg R +0.520
  #             TF lain: 15m n=169 avg R +0.112, 4h n=32 avg R -0.037 (kecil, campur)
  #   PULLBACK: bonus flat +4 lama membuat populasi nyaris impas (~breakeven),
  #             diturunkan ke 0 di semua arah/TF
  # Simulasi ulang skema di bawah atas 1564 trade historis: sum R -108.05 ->
  # +30.24 (avg R -0.069 -> +0.026), volume trade tersisa ~74%. Precedence
  # lookup (paling spesifik menang): [timeframe][direction][setup] >
  # [timeframe][setup] > [direction][setup] > [setup] flat.
  # CATATAN: ini hasil in-sample dari satu window backtest (bukan
  # out-of-sample tervalidasi) — cek ulang setelah ada data baru, terutama
  # angka-angka dengan n kecil (4h SHORT EXTENDED n=16, 4h BREAKOUT n=32).
  setup_bonus:
    breakout: 8
    pullback: 0        # dari 4 — populasi pullback nyaris impas, bukan edge positif
    continuation: -18  # dari -12 — net rugi di semua TF
    extended: -8       # dipakai sbg fallback (mis. 4h LONG, TF tanpa override eksplisit)
    long:
      extended: -22    # LONG EXTENDED net rugi besar di semua TF (fallback sebelum override TF)
    short:
      extended: 3      # SHORT EXTENDED netral/positif di 15m & 1h (lihat override 4h di bawah)
    "15m":
      long:
        extended: -40  # kombinasi terburuk secara mutlak (n=170, sum R -56.56)
    "1h":
      breakout: 16     # kombinasi terbaik secara mutlak (n=94, avg R +0.283)
    "4h":
      continuation: -28  # continuation paling parah di 4h (n=53, avg R -0.207)
      short:
        extended: -6     # override "short.extended: 3" di atas — sampel 4h (n=16) masih negatif
  mtf_agreement_excluded_setups:
    - extended  # trade EXTENDED yg "disetujui" TF lain avg R-nya malah lebih buruk (lihat get_setup_bonus di scanner.py)
  min_score_to_trigger: 63
  min_trend_alignment: 2
  min_direction_margin: 8

risk:
  atr_multiplier_sl: 1.8
  risk_reward_min: 1.8
  max_signals_per_run: 4
  adx_min: 21
  adx_strong: 35
  structure_sl_max_atr_mult: 2.5
  structure_sl_max_atr_mult_breakout: 3.5
  reject_structural_stop_too_wide: true
  max_signals_per_regime_episode: 2

setup_engine:
  structure_lookback: 20
  stop_lookback: 10
  pullback_atr_mult: 1.0
  breakout_buffer_atr_mult: 0.10
  extended_atr_mult: 3.2
  # Guardrail BARU: di atas ambang ini, setup diklasifikasikan OVEREXTENDED dan
  # sinyal DITOLAK langsung (bukan cuma dapat bonus 0 seperti EXTENDED biasa).
  # Backtest tidak mencatat jarak-ke-EMA per trade, jadi angka ini belum
  # divalidasi lewat re-run — defaultnya sengaja longgar (~1.8x extended_atr_mult)
  # supaya cuma menyaring kasus blow-off/capitulation paling ekstrem. Cek ulang
  # setelah backtest ulang; naikkan kalau ternyata kebanyakan menolak trade sehat.
  overextended_atr_mult: 5.5
  structure_sl_buffer_atr_mult: 0.25
  target_lookback: 40
  "15m":
    structure_lookback: 40
    stop_lookback: 10
    breakout_buffer_atr_mult: 0.12
    extended_atr_mult: 2.5
    overextended_atr_mult: 4.5
    target_lookback: 80
  "1h":
    structure_lookback: 25
    stop_lookback: 8
    breakout_buffer_atr_mult: 0.10
    extended_atr_mult: 3.0
    overextended_atr_mult: 5.5
    target_lookback: 50
  "4h":
    structure_lookback: 30
    stop_lookback: 6
    breakout_buffer_atr_mult: 0.08
    extended_atr_mult: 4.5
    overextended_atr_mult: 8.0
    target_lookback: 60
    pullback_atr_mult: 0.6

regime_filter:
  enabled: true
  symbol: "BTCUSDT"
  timeframe: "4h"
  adx_min: 27
  # PERUBAHAN: dari "bear_only" -> "not_bull". Temuan kunci dari 947 trade
  # backtest (10 simbol x 3 TF, Mar-Sep 2026): SHORT = 0 trade sama sekali.
  # Dengan "bear_only", SHORT cuma boleh kalau regime BTC 4h = BEAR (ADX>=27,
  # EMA & Supertrend sama-sama turun) — kondisi itu rupanya nyaris tidak pernah
  # terjadi sepanjang 6 bulan data ini, jadi sisi SHORT jadi mati total meski
  # ada altcoin yang boleh jadi punya struktur turun sendiri saat BTC ranging.
  # "not_bull" membolehkan SHORT saat regime BEAR ATAU NEUTRAL (cuma diblokir
  # saat BTC jelas-jelas BULL) — lebih seimbang, tapi CATATAN: karena SHORT
  # tidak pernah aktif di data lama, performa mode baru ini belum tervalidasi
  # lewat backtest. Uji ulang (backtest.py --batch) sebelum percaya penuh, dan
  # kembalikan ke "bear_only" kalau ternyata SHORT di regime NEUTRAL hasilnya jelek.
  short_mode: "not_bull"
  long_mode: "bull_only"

symbol_filter:
  blacklist: []

notify:
  telegram:
    enabled: true
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"

backtest:
  fee_round_trip_pct: 0.001
  intrabar_tie_break: "conservative"
  max_holding_bars: 64

chart:
  auto_generate: true
  width_px: 2000
  height_ratio: 0.45
  candles_shown: 120
  theme:
    background: "#0d0d0f"
    grid: "#1c1c22"
    text: "#d8d8e0"
    bull: "#2ecc71"
    bear: "#e74c3c"
    ema: "#f5c542"
    supertrend_up: "#2ecc71"
    supertrend_down: "#e74c3c"
    entry: "#3498db"
    sl: "#e74c3c"
    tp: "#2ecc71"
    zone_fill: "#3498db"
    zone_alpha: 0.12