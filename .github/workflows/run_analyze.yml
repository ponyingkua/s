name: Analyze Symbol(s)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Nama Symbol (pisahkan dengan koma). Contoh: ZEC,SOL,BTC atau ZECUSDT,SOLUSDT"
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan analisa multi-timeframe
        run: python analyze.py --symbols "${{ inputs.symbols }}"

      - name: Upload hasil analisa (1 artifact, file terpisah per token)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analisa-multi-${{ github.run_number }}
          path: analysis_output/
          if-no-files-found: warn
          retention-days: 14