name: Backtest (manual)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Simbol, contoh: BTCUSDT"
        default: "BTCUSDT"
        required: true
      timeframe:
        description: "Timeframe, contoh: 15m / 1h / 4h"
        default: "1h"
        required: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan backtest
        run: |
          PYTHONPATH=src python run_backtest.py \
            --symbol "${{ github.event.inputs.symbol }}" \
            --timeframe "${{ github.event.inputs.timeframe }}"

      - name: Commit hasil backtest
        run: |
          git config user.name "vsynapse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backtest_result.md
          git diff --quiet --cached || git commit -m "chore: backtest ${{ github.event.inputs.symbol }} ${{ github.event.inputs.timeframe }}"
          git push
