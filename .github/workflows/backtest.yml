name: Backtest (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "single (1 simbol) atau batch (banyak simbol)"
        type: choice
        options: ["single", "batch"]
        default: "single"
      symbol:
        description: "Simbol untuk mode single, mis. BTCUSDT"
        default: "BTCUSDT"
      symbols:
        description: "Simbol dipisah koma untuk mode batch (kosongkan = 10 default)"
        default: ""
      timeframe:
        description: "Timeframe, mis. 15m / 1h / 4h"
        default: "1h"
      limit:
        description: "Jumlah candle historis (>1500 otomatis di-pagination lewat get_klines_paginated)"
        default: "1000"
      days:
        description: "Cakupan kalender (hari) - override limit biar sama rata lintas timeframe (kosongkan buat pakai limit biasa)"
        default: ""
      mtf:
        description: "Aktifkan MTF agreement bonus (mirip live scanner)"
        type: choice
        options: ["true", "false"]
        default: "true"

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Jalankan backtest
        run: |
          if [ -n "${{ github.event.inputs.days }}" ]; then
            EXTRA_ARGS=(--days "${{ github.event.inputs.days }}")
          else
            EXTRA_ARGS=(--limit "${{ github.event.inputs.limit }}")
          fi

          if [ "${{ github.event.inputs.mtf }}" = "false" ]; then
            EXTRA_ARGS+=(--no-mtf)
          else
            EXTRA_ARGS+=(--mtf)
          fi

          if [ "${{ github.event.inputs.mode }}" = "batch" ]; then
            if [ -z "${{ github.event.inputs.symbols }}" ]; then
              python backtest.py --batch --timeframe "${{ github.event.inputs.timeframe }}" "${EXTRA_ARGS[@]}"
            else
              python backtest.py --batch --symbols "${{ github.event.inputs.symbols }}" --timeframe "${{ github.event.inputs.timeframe }}" "${EXTRA_ARGS[@]}"
            fi
          else
            python backtest.py --symbol "${{ github.event.inputs.symbol }}" --timeframe "${{ github.event.inputs.timeframe }}" "${EXTRA_ARGS[@]}"
          fi
      - name: Upload raw trade log (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: trades-raw-${{ github.event.inputs.mode }}-${{ github.event.inputs.timeframe }}
          path: |
            trades_raw.json
            trades_raw_batch.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit hasil backtest
        run: |
          git config user.name "vsynapse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backtest_result.md backtest_batch_result.md 2>/dev/null || true
          git diff --quiet --cached || git commit -m "chore: backtest ${{ github.event.inputs.mode }} ${{ github.event.inputs.timeframe }} (mtf=${{ github.event.inputs.mtf }})"
          git push
