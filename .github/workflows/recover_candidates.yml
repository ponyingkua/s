name: Recover Candidates History

on:
  workflow_dispatch: {}

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Wajib fetch-depth 0 -- default checkout cuma ambil commit
          # terakhir (shallow), sedangkan skrip ini butuh SELURUH histori
          # commit untuk menelusuri versi lama synaptic_candidates.json
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Jalankan recovery
        run: python recover_candidates.py

      - name: Commit hasil recovery
        run: |
          git config user.name "vsynapse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add synaptic_candidates_recovered.json
          git diff --quiet --cached || git commit -m "chore: recover candidates history from git log"
          git push
