name: vSynapse Scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      chart_format:
        description: "Format chart yang dikirim ke Telegram"
        required: false
        default: "square"
        type: choice
        options:
          - wide
          - square

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --out synaptic_candidates.json --chart-format "${{ github.event.inputs.chart_format || 'square' }}"
      - name: Commit hasil scan
        run: |
          git config user.name "vsynapse-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p charts
          git add synaptic_candidates.json signal_state.json charts/
          git diff --quiet --cached || git commit -m "chore: update scan results"
          git push