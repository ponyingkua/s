name: Chart Generator (manual)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Simbol, mis. BTCUSDT"
        default: "BTCUSDT"
      timeframe:
        description: "Timeframe, mis. 15m / 1h / 4h (dipakai kalau mode bukan multi/compare)"
        default: "1h"
      mode:
        description: "Jenis chart"
        type: choice
        options:
          - clean
          - multi
          - compare
        default: clean
      timeframes:
        description: "Khusus mode multi, dipisah koma"
        default: "15m,1h,4h"
      symbols:
        description: "Khusus mode compare, dipisah koma, min. 2 simbol"
        default: ""
      compare_lookback:
        description: "Khusus mode compare, jumlah candle"
        default: "100"
      hide_indicators:
        description: "Sembunyikan EMA & Supertrend (biasa dipakai bareng mode clean)"
        type: boolean
        default: false
      ratio:
        description: "Rasio output: wide (default) atau square (1:1, untuk feed Binance Square/IG)"
        type: choice
        options:
          - wide
          - square
        default: wide

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Generate chart
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: ${{ github.event.inputs.symbol }}
          TIMEFRAME: ${{ github.event.inputs.timeframe }}
          MODE: ${{ github.event.inputs.mode }}
          TIMEFRAMES: ${{ github.event.inputs.timeframes }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
          COMPARE_LOOKBACK: ${{ github.event.inputs.compare_lookback }}
          HIDE_INDICATORS: ${{ github.event.inputs.hide_indicators }}
          RATIO: ${{ github.event.inputs.ratio }}
        run: |
          ARGS=(--symbol "$SYMBOL" --timeframe "$TIMEFRAME" --mode "$MODE")
          [ -n "$TIMEFRAMES" ] && ARGS+=(--timeframes "$TIMEFRAMES")
          [ -n "$SYMBOLS" ] && ARGS+=(--symbols "$SYMBOLS")
          [ -n "$COMPARE_LOOKBACK" ] && ARGS+=(--compare-lookback "$COMPARE_LOOKBACK")
          [ "$HIDE_INDICATORS" = "true" ] && ARGS+=(--hide-indicators)
          [ -n "$RATIO" ] && ARGS+=(--ratio "$RATIO")
          python chart.py "${ARGS[@]}"
      - name: Commit chart
        run: |
          git config user.name "vsynapse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add charts/
          git diff --quiet --cached || git commit -m "chore: generate chart ${{ github.event.inputs.symbol }} ${{ github.event.inputs.mode }}"
          git push