name: Backtest vSynapse Analyzer

# Manual/on-demand only -- unlike analyze-symbols.yml (scheduled scanning),
# a backtest run is exploratory and can be heavy (thousands of candles x
# multiple symbols x multiple timeframes, tens of thousands of walk-forward
# steps), so it's triggered deliberately with explicit parameters rather
# than on a cron schedule.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols (e.g. BTCUSDT,ETHUSDT,SOLUSDT)"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      timeframes:
        description: "Comma-separated timeframes"
        required: false
        default: "15m,1h,4h"
      days:
        description: "History length in days"
        required: false
        default: "180"

jobs:
  backtest:
    runs-on: ubuntu-latest
    # Backtests over long history (esp. 15m) can take a while since
    # analyze_timeframe() recomputes indicators on the full expanding slice
    # at every step -- give it real headroom instead of the 6h default.
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy aiohttp pyyaml

      - name: Run backtest
        run: |
          python bcktst.py \
            --symbols "${{ github.event.inputs.symbols }}" \
            --timeframes "${{ github.event.inputs.timeframes }}" \
            --days "${{ github.event.inputs.days }}" \
            --output backtest_output/trades.json

      - name: Upload raw trades (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades-${{ github.run_id }}
          # analyze_timeframe() logs a [warn] line per failed step directly
          # to stdout/stderr rather than a file, so the summary report and
          # any warnings only survive in the job log -- upload-artifact only
          # captures files. if_no_files_found guards the case where the run
          # crashed before trades.json was ever written.
          path: backtest_output/trades.json
          if-no-files-found: warn
          retention-days: 30